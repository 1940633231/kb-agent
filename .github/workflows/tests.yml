name: tests

# kb-agent 的检索链路是"同进程 import production-rag"（方案 §2.2），
# 而 production-rag 是**公开仓库**，所以 CI 正常拉取它并跑完整用例。
#
# 仍然保留降级路径的唯一理由：网络抖动不该让构建变红。拉取失败时只跑不依赖它的
# 子集（语料与索引不在版本库里，相关用例本来就会 skip），并把运行模式写进
# Step Summary，避免"看起来全绿其实只跑了一半"。
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉取 production-rag（公开仓库）
        id: sibling
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if git clone --depth 1 https://github.com/1940633231/production-rag.git ../production-rag; then
              echo "resolved_commit=$(git -C ../production-rag rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "第 $attempt 次拉取失败，重试…"
            sleep 5
          done
          exit 1

      - name: 安装依赖
        id: deps
        run: |
          python -m pip install --upgrade pip
          if [ -d ../production-rag ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            pip install -r requirements.txt
            pip install -e ../production-rag
          else
            echo "mode=lite" >> "$GITHUB_OUTPUT"
            pip install -r requirements-ci.txt
          fi

      - name: 记录运行模式与 production-rag 版本
        run: |
          {
            echo "### 测试环境"
            echo "- 模式：**${{ steps.deps.outputs.mode }}**"
            echo "- production-rag commit：\`${{ steps.sibling.outputs.resolved_commit || '未取到（降级为 lite）' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 跑测试（跳过原因用 -rs 打印）
        run: python -m pytest tests -q -rs

      - name: 校验 golden set 结构、题型配比与 id 唯一性
        run: |
          python - <<'PY'
          import json, collections, pathlib
          rows = [json.loads(l) for l in
                  pathlib.Path("evals/golden_set.jsonl").read_text(encoding="utf-8").splitlines()
                  if l.strip()]
          kinds = collections.Counter(r["question_type"] for r in rows)
          assert len(rows) >= 50, f"验收集应 ≥50 题，当前 {len(rows)}"
          assert len({r['id'] for r in rows}) == len(rows), "id 必须唯一"
          for required in ("fact", "table", "cross_section", "cross_document", "calc", "refuse"):
              assert kinds.get(required), f"缺题型 {required}"
          for row in rows:
              if row["question_type"] == "calc":
                  assert row.get("evidence_literals"), f"{row['id']} 缺 evidence_literals"
          print("golden set OK:", len(rows), dict(kinds))
          PY
